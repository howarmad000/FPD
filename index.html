<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maddy's Big Girl Website</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#40271f;font-family:system-ui}body{overflow-x:hidden}.stage{position:relative;width:100vw;aspect-ratio:16/9;min-height:100vh;overflow:hidden;background:#40271f}.scene{position:absolute;inset:0;z-index:0;background:url("assets/dashboard-cafe-v8.png") center/100% 100% no-repeat}.ai-motion-scene{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;background:#40271f}.hotspot{position:absolute;z-index:20;border:0;background:transparent;cursor:pointer;border-radius:18px;transition:background .18s,box-shadow .18s,transform .18s}.hotspot:hover,.hotspot:focus-visible{outline:none;background:#fff8ef13;box-shadow:0 0 0 2px #fff8ef66,0 8px 24px #4d2f2520;transform:translateY(-1px)}
/* Sidebar hotspots follow the visible dark navigation panel only, stopping before the vines. */
.nav-dashboard,.nav-accounts,.nav-transactions,.nav-spending,.nav-recurring,.nav-calendar,.nav-goals,.nav-settings{left:0.35%;width:10.15%;height:5.1%;border-radius:12px}
.nav-dashboard{top:15.0%}.nav-accounts{top:20.45%}.nav-transactions{top:25.9%}.nav-spending{top:31.35%}.nav-recurring{top:36.8%}.nav-calendar{top:42.25%}.nav-goals{top:47.7%}.nav-settings{top:53.15%}
.connect{right:2.2%;top:5.4%;width:10.7%;height:5.6%}.add-transaction{left:23%;top:36.3%;width:9.6%;height:4.5%}.add-goal{left:33%;top:36.3%;width:8.5%;height:4.5%}.view-calendar{left:41.8%;top:36.3%;width:9%;height:4.5%}.connect-account{left:51%;top:36.3%;width:10.2%;height:4.5%}.recent{left:23%;top:57.4%;width:26%;height:27%}.spending{left:50.2%;top:57.4%;width:25.8%;height:27%}.events{left:76.8%;top:57.4%;width:17.2%;height:27%}.mobile-note{display:none}@media(max-width:700px){body{overflow:auto;background:#6f4634}.stage{width:177.777vw;min-height:100vh;height:100vh;aspect-ratio:auto;transform:translateX(-35vw)}.scene{background-size:auto 100%;background-position:center top}.ai-motion-scene{object-fit:cover;object-position:center top}.mobile-note{display:block;position:fixed;z-index:50;left:12px;right:12px;bottom:12px;padding:9px 12px;text-align:center;border-radius:16px;background:#fff8eddb;color:#583b31;backdrop-filter:blur(10px);box-shadow:0 8px 24px #3e271f35;font-size:12px;pointer-events:none}}@media(prefers-reduced-motion:reduce){.ai-motion-scene{display:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Maddy's cozy finance dashboard"><div class="scene" aria-hidden="true"></div><video class="ai-motion-scene" autoplay muted loop playsinline preload="auto" poster="assets/dashboard-cafe-v8.png" aria-hidden="true"><source src="assets/dashboard-cafe-ai-motion.mp4" type="video/mp4"></video><button class="hotspot nav-dashboard" aria-label="Dashboard"></button><button class="hotspot nav-accounts" aria-label="Accounts"></button><button class="hotspot nav-transactions" aria-label="Transactions"></button><button class="hotspot nav-spending" aria-label="Spending"></button><button class="hotspot nav-recurring" aria-label="Recurring"></button><button class="hotspot nav-calendar" aria-label="Calendar"></button><button class="hotspot nav-goals" aria-label="Goals"></button><button class="hotspot nav-settings" aria-label="Settings"></button><button class="hotspot connect" aria-label="Connect bank"></button><button class="hotspot add-transaction" aria-label="Add transaction"></button><button class="hotspot add-goal" aria-label="Add goal"></button><button class="hotspot view-calendar" aria-label="View calendar"></button><button class="hotspot connect-account" aria-label="Connect account"></button><button class="hotspot recent" aria-label="Recent transactions"></button><button class="hotspot spending" aria-label="Spending by category"></button><button class="hotspot events" aria-label="Upcoming events"></button></main><div class="mobile-note">Swipe/scroll the café horizontally on phone — dedicated mobile composition comes after we lock this desktop master.</div>
</body></html>
